<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card-container { background: #fff; width: 100%; max-width: 400px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; text-align: center; padding-bottom: 25px; }
        .card-header { background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; padding: 30px 20px; }
        .card-header h2 { margin: 10px 0 5px; font-size: 24px; }
        .card-header p { margin: 0; opacity: 0.9; font-size: 14px; }
        .card-body { padding: 20px; }
        .info-item { background: #f8fafc; margin: 10px 0; padding: 12px; border-radius: 10px; font-weight: 600; color: #334155; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; text-decoration: none; color: white; display: inline-block; }
        .btn-call { background: #22c55e; }
        .btn-whatsapp { background: #25d366; }
        .btn-share { background: #3b82f6; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card-container" id="cardBox">
        <div class="card-header">
            <h2 id="userName">लोड हो रहा है...</h2>
            <p id="businessName">व्यवसाय का नाम</p>
        </div>
        <div class="card-body">
            <div class="info-item" id="phoneDisplay">📞 0000000000</div>
            
            <div class="btn-group">
                <a href="#" id="callBtn" class="btn btn-call">कॉर्ल करें</a>
                <a href="#" id="waBtn" class="btn btn-whatsapp">WhatsApp</a>
            </div>
            <button onclick="shareCard()" class="btn btn-share">कार्ड शेयर करें 🚀</button>
        </div>
    </div>

    <script>
        // URL से यूजर का ID या फोन नंबर लेकर डेटा लोड करना
        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('id');

        if(cardId) {
            fetch(`https://digital-smart-card.onrender.com/api/get-card/${cardId}`)
                .then(res => res.json())
                .then(data => {
                    if(data.success) {
                        document.getElementById('userName').innerText = data.card.fullName;
                        document.getElementById('businessName').innerText = data.card.businessName;
                        document.getElementById('phoneDisplay').innerText = "📞 " + data.card.phone;
                        document.getElementById('callBtn').href = "tel:" + data.card.phone;
                        document.getElementById('waBtn').href = `https://wa.me/91${data.card.phone}?text=Hello%20${data.card.fullName}`;
                    } else {
                        alert('कार्ड नहीं मिला!');
                    }
                }).catch(err => console.log(err));
        }

        function shareCard() {
            if (navigator.share) {
                navigator.share({
                    title: 'Digital Business Card',
                    url: window.location.href
                }).catch(console.error);
            } else {
                alert('लिंक कॉपी कर ली गई है!');
            }
        }
    </script>
</body>
</html>
